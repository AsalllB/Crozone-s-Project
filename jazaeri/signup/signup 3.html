<!DOCTYPE html>
<html>
  <head>
    <title>ثبت نام</title>
    <link rel="stylesheet" href="signup 3.css" />
  </head>
  <body>
    <header>
      <div class="header">
      <img src="home.png" alt="" />
      <a href="">صفحه اصلی</a>
    </div>
    </header>
    <div class="signup-form">
      <div class="logo">
        <img src="Food+Drug Logo 1.png" alt="غذا-دارو" />
      </div>
      <div class="input-form">
        <div class="name">
          <p>ثبت نام در سایت</p>
        </div>
        <div class="input">
          <input type="text" placeholder="نام کاربری" />
          <input type="email" placeholder="ایمیل" />
          <input type="password" placeholder="رمز عبور" />
          <input type="password" placeholder="تکرار رمز عبور" />
        </div>
      </div>
      <div class="Conditions">
        <label 
          ><input class="lable" type="checkbox" />با <a href="">شرایط</a> سایت
          غذا-دارو موافق هستم.</label
        >
      </div>
      <div class="button">
        <button>ثبت نام</button>
      </div>
      <div class="login">
        <a href="">ورود به سایت</a>
      </div>
    </div>
  </body>
</html>
